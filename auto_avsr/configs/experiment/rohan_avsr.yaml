# @package _global_
# Japanese AVSR baseline -- cross-lingual transfer, framework (c) [proposed].
# Fine-tune BOTH front-ends inherited from English models:
#   - visual front-end (3D conv + 2D ResNet-18) from the English VSR checkpoint
#   - audio  front-end (1D ResNet-18)           from the English ASR checkpoint
# The Conformer back-ends, MLP fusion, CTC projection and Transformer decoder
# are trained from scratch on Japanese data.
#
# Usage (after extracting front-ends with module_extractor/extractor.py):
#   python train.py +experiment=rohan_avsr \
#       exp_dir=exp exp_name=rohan_avsr \
#       data.dataset.root_dir=/path/to/rohan_preprocessed \
#       pretrained_visual_frontend_path=../module_extractor/frontends/frontend_visual_trlrs3.pth \
#       pretrained_audio_frontend_path=../module_extractor/frontends/frontend_audio_trlrs3.pth
defaults:
  - override /data/dataset: rohan

data:
  modality: audiovisual
  lang: ja
  max_frames: 1000
  max_frames_val: 1000

optimizer:
  lr: 1e-4
  warmup_epochs: 5

trainer:
  max_epochs: 40

transfer_frontend: true

# The paper uses 19,200 Hz audio for AVSR to reduce zero-padding during A/V
# synchronisation. To follow that setting, also set:
#   data.dataset.rate_ratio=768
# and preprocess the ROHAN audio at 19,200 Hz.

# @package _global_
# Japanese VSR baseline -- cross-lingual transfer, framework (c), RETRAIN on the
# preprocessing-fixed corpus (25 fps, 96x96 mouth-normalised ROI). Identical
# hyperparameters to rohan_vsr; only the input data pipeline differs.
#
# The fixed dataset root is BAKED IN below (do not rely on a CLI override: a
# forgotten override silently trains on the broken rohan_preprocessed videos --
# this exact mistake produced the invalid 150%-CER rohan_vsr_3448 run on
# 2026-07-08).
#
# Usage:
#   python train.py +experiment=rohan_vsr_fixed \
#       exp_dir=exp exp_name=rohan_vsr_fixed \
#       pretrained_model_path=../module_extractor/frontends/frontend_visual_3448.pth
defaults:
  - override /data/dataset: rohan

data:
  modality: video
  lang: ja
  max_frames: 1600
  max_frames_val: 1600
  dataset:
    root_dir: C:/Users/Hiroyuki/gr_avsr/datasets/rohan_preprocessed_fixed

optimizer:
  lr: 1e-4
  warmup_epochs: 5

trainer:
  max_epochs: 60

transfer_frontend: true

# @package _global_
# Japanese VSR baseline -- cross-lingual transfer, framework (c).
# Fine-tune the visual front-end (3D conv + 2D ResNet-18) inherited from the
# English VSR model; train the Conformer back-end + decoder from scratch.
#
# Usage (after extracting front-ends with module_extractor/extractor.py):
#   python train.py +experiment=rohan_vsr \
#       exp_dir=exp exp_name=rohan_vsr \
#       data.dataset.root_dir=/path/to/rohan_preprocessed \
#       pretrained_model_path=../module_extractor/frontends/frontend_visual_trlrs3.pth
defaults:
  - override /data/dataset: rohan

data:
  modality: video
  lang: ja
  max_frames: 1600
  max_frames_val: 1600

optimizer:
  lr: 1e-4
  warmup_epochs: 5

trainer:
  max_epochs: 60

transfer_frontend: true
